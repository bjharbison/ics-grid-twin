# Mosquitto 2 config for the ICS lab broker.
#
# Mosquitto 2 defaults to localhost-only and anonymous-denied. Both are
# deliberate here: every client authenticates, and the ACL is default-deny.

# Field devices, bridge, fleet manager -- raw MQTT over TCP.
listener 1883 0.0.0.0

# Browser clients (the digital twin) -- MQTT over WebSockets.
# A browser cannot open a raw TCP socket, so the twin's live path needs this
# listener. Same auth and same default-deny ACL as 1883: the twin connects as
# read-only `monitor-reader` and gets nothing it isn't granted.
listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# No anonymous clients. Ever.
allow_anonymous false

# Generated with mosquitto_passwd -- see docs/quickstart.md. Gitignored.
password_file /mosquitto/config/passwd

# Default-deny. A user with no matching rule gets nothing, silently.
acl_file /mosquitto/config/acl
